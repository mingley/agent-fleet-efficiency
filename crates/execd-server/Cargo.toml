[package]
name = "execd-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-execd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
execd-protocol = { path = "../execd-protocol" }
