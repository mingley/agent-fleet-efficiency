[package]
name = "execd-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
nix = { version = "0.31", features = ["process", "signal", "term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
execd-protocol = { path = "../execd-protocol" }
